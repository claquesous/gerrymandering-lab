[package]
name = "district-scorecard"
version = "0.1.0"
edition = "2021"
description = "Scores US congressional districts against county-split and straight-line anti-gerrymandering rules"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
geo = "0.33.1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shapefile = { version = "0.9.0", features = ["geo-types"] }

[profile.release]
debug = 1
